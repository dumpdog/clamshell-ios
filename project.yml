# Fallback: if Clamshell.xcodeproj won't open, run `brew install xcodegen && xcodegen`
# in this folder to regenerate it from this spec.
name: Clamshell
options:
  bundleIdPrefix: com.justinlum
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Clamshell:
    type: application
    platform: iOS
    sources: [Clamshell]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinlum.clamshell
        DEVELOPMENT_TEAM: C45F8L9TW8
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Clamshell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DUO_SDK $(inherited)"
